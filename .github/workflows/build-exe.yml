
name: Build Excel Matcher EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl rapidfuzz pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --console --clean excel_data_matcher.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Excel-Match-Finder-Windows
          path: dist/excel_data_matcher.exe
          
